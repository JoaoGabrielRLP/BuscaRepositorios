<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca Repositórios</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="search-panel">
        <h1 class="title">Buscar repositórios</h1>
        <label class="sr-only" for="searchInput">Buscar repositórios no GitHub</label>
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Digite um termo e pressione Enter"
          aria-label="Busca de repositórios"
        />
      </section>

      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script src="assets/script.js"></script>
  </body>
</html>
